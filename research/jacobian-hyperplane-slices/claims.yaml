project: hyperplane-slices-of-marked-cubic-map
status_date: 2026-07-27
field: complex algebraic geometry
base_field: C
scope:
  affine_hyperplanes: "H_ell = {C in Sym^3(C^2)^* : ell(C)=1}, ell != 0"
  excludes: "zero-level linear slices ell(C)=0 and characteristics 2 or 3"
claims:
  - id: universal-etaleness
    statement: "Phi(L,Q)=(LQ,Res(L,Q)) is etale wherever Res(L,Q) is nonzero."
    proof_type: tangent-space argument
    machine_check: five-dimensional determinant equals -rho^2
    script_check: "five-dimensional determinant = -rho^2"
  - id: slice-etaleness
    statement: "For every nonzero ell, f_ell:X_ell->H_ell is etale."
    proof_type: base change of universal-etaleness
  - id: marked-root-fibers
    statement: "The geometric fiber over C is the set of simple roots of C."
    consequences:
      distinct_roots: 3
      double_plus_simple: 1
      triple_root: 0
  - id: hyperplane-orbits
    statement: "Up to PGL_2 and scalar, projective hyperplanes have contact type 1+1+1, 2+1, or 3 with the twisted cubic."
    proof_type: degree-three divisor classification on P1
  - id: tangent-source
    statement: "Contact type 2+1 gives X_ell isomorphic to A^3."
    proof_type: two successive Zariski-locally-trivial A1-bundles
    coordinate_free_core: true
  - id: transverse-obstruction
    statement: "Contact type 1+1+1 gives [X_ell]=L^3-L and compactly supported Euler characteristic 0."
    proof_type: marked-root projection and Grothendieck-class stratification
  - id: osculating-source
    statement: "Contact type 3 gives X_ell isomorphic to G_m x A^2."
    proof_type: normal-form elimination
  - id: classification
    statement: "X_ell is isomorphic to A^3 iff the projective hyperplane is tangent but not osculating to the twisted cubic."
    depends_on:
      - tangent-source
      - transverse-obstruction
      - osculating-source
  - id: explicit-chart
    statement: "The displayed forward and inverse polynomial formulas are mutually inverse."
    proof_type: exact polynomial identities modulo the two defining equations
    script_checks:
      - "forward chart satisfies resultant=1"
      - "forward chart satisfies fixed coefficient=1"
      - "backward chart recovers b"
      - "backward chart recovers c"
      - "backward chart recovers d"
      - "backward chart recovers e"
  - id: explicit-keller-map
    statement: "The clean coefficient map G has determinant -1 and is left-right linearly equivalent to the announced map F with determinant -2."
    script_checks:
      - "det(DG)=-1"
      - "det(DF)=-2"
      - "collision point 1"
      - "collision point 2"
      - "collision point 3"
  - id: nonproperness
    statement: "The discriminant hypersurface is the nonproperness locus; the triple-root curve is omitted."
    proof_type: marked-simple-root compactification
  - id: higher-degree-obstruction
    statement: "For the analogous irreducible two-boundary degree-n complement, Cl(U_n)=Z/(n-2)Z."
    proof_type: divisor localization sequence
limitations:
  - "The public counterexample and surrounding literature were less than ten days old at the status date and not yet refereed."
  - "The manuscript assembles and proves a classification; it does not assert priority for the counterexample or its geometric ingredients."
  - "The exact verifier certifies coordinate identities, not the coordinate-free bundle and Grothendieck-ring arguments."
